<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nexus AndroKiller - Live Screen Stream Viewer</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #090d16;
      color: #e2e8f0;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      width: 100%;
      max-width: 900px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      color: #38bdf8;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      min-height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      max-height: 70vh;
      object-fit: contain;
    }
    .footer {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    #status {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.4;
      flex: 1;
    }
    button {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📺 Android Live Screen Viewer</h1>
      <div style="display: flex; gap: 8px;">
        <button id="reconnectBtn">🔄 Reconnect Stream</button>
        <button id="fullscreenBtn" style="background: #4f46e5;">⛶ Fullscreen</button>
      </div>
    </div>
    <div class="video-wrapper">
      <video id="remoteVideo" autoplay playsinline muted></video>
    </div>
    <div class="footer">
      <div id="status">Initializing...</div>
    </div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script>
    window.ANDROID_PEER_ID = new URLSearchParams(location.search).get('peerId') || 'android-screen';
  </script>
  <script src="./viewer.js"></script>
</body>
</html>
